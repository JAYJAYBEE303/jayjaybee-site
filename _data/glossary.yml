# =============================================================================
# glossary.yml — definitions behind the clickable values in a wiki infobox.
#
# A key is an infobox value, LOWERCASED and trimmed. _includes/wiki-infobox.html
# tries each value whole first, then splits it on "·" and tries each part, so
# both "live · iterating" as a whole and "live" on its own can be defined.
# A part with no key here renders as plain text — that is the normal case,
# not a failure.
#
#   kind:  the small accent label at the top of the card
#   text:  the definition
#   ref:   optional — a SECTION slug. Renders "Full entry: <title> →".
#          An unresolvable slug renders no link rather than a broken one.
# =============================================================================

"live · iterating":
  kind: Status
  text: >
    Deployed and in use, with the model still being retuned between
    gameweeks. Not a finished product and not pretending to be one.

"one vercel function":
  kind: Backend
  text: >
    The single serverless function exists only because the FPL API sends
    no CORS headers. It fetches from an allowlist and forwards. It holds
    no state, no keys, and no logic of its own.
  ref: the-data

"fpl api":
  kind: Source
  text: >
    Supplies the spine — squads, prices, positions, fixtures, per-player
    histories and live gameweek scoring. It has no standings endpoint and
    no access to any season but the current one.
  ref: the-data

"understat":
  kind: Source
  text: >
    Not an API, but it fills the gaps the FPL feed leaves: expected goals,
    six seasons of fixture lists, chronological match timelines, and
    rosters with position codes and substitution linkage.
  ref: the-data

"5 weighted sub-metrics":
  kind: Model
  text: >
    Base difficulty, counter-matchup, team form, head-to-head and home
    and away. Each is scored separately, weighted, and combined into one
    CompositeScore — because "hard fixture" and "hard fixture for a
    winger" are different questions.
  ref: calculations

"none":
  kind: Build step
  text: >
    No bundler, no framework, no compile. The thing that ships is the
    thing that was edited, and there is no toolchain to rot between one
    season and the next.

"html · js · vanilla css":
  kind: Stack
  text: >
    Everything analytical runs in the browser. No framework, and no CSS
    library — the tokens and components are the app's own.

"html · js · tailwind":
  kind: Stack
  text: >
    Rebuilt in Tailwind once the formulas had stopped moving —
    deliberately in that order, so styling effort was not spent on
    layouts the maths was about to invalidate.
  ref: two-layouts

"mobile read · desktop compare":
  kind: Layouts
  text: >
    Mobile gets one player and the numbers that matter. Desktop gets the
    comparison view, because comparison is what people open a calculator
    for and it needs horizontal room.
  ref: two-layouts

"~2,500 lines · one file":
  kind: Size
  text: >
    A single document holding markup and logic together. Large for one
    file, and the deliberate trade for having no build step at all.
  ref: one-file-no-build

# -----------------------------------------------------------------------------
# Gaffer IQ's shape panel — the vocabulary the write-up assumes. Same keys and
# same shape as everything above; these are just grouped in the infobox by
# `shape` on the app page rather than sitting on the right of a key/value row.
# -----------------------------------------------------------------------------

"static":
  kind: App shape
  text: >
    The app's files (HTML/CSS/JS) are served exactly as written, with
    nothing generated per-request.
  ref: approach

"frontend-built":
  kind: App shape
  text: >
    Nearly all the logic runs in the browser, not on a server. This is
    the app's core design choice.
  ref: approach

"single-page application (spa)":
  kind: App shape
  text: >
    One HTML page, JavaScript swaps content in and out instead of
    loading new pages.
  ref: the-interface

"vanilla js":
  kind: Build approach
  text: >
    No framework (no React/Vue). Plain JavaScript, run as-is.
  ref: approach

"es modules":
  kind: Build approach
  text: >
    The browser-native way files import each other (import/export), no
    bundler needed.
  ref: approach

"no build step":
  kind: Build approach
  text: >
    The code that runs is exactly the code you wrote, nothing compiles
    or transforms it first.
  ref: approach

"cors":
  kind: Servers
  text: >
    The browser security rule that blocks a webpage from calling a
    different site's API directly. It's why the proxy exists.
  ref: the-data

"serverless":
  kind: Servers
  text: >
    Backend code that runs on-demand in short bursts, with no server you
    keep running yourself. The proxy is this.
  ref: the-data

"proxy":
  kind: Servers
  text: >
    The serverless function's job: forward requests, don't process them.
  ref: the-data

"allowlist":
  kind: Servers
  text: >
    The proxy only forwards requests matching pre-approved URL patterns,
    rejecting everything else.
  ref: the-data

"rest api":
  kind: Servers
  text: >
    FPL's data source is fixed-endpoint REST, not GraphQL.
  ref: the-data

"client-side rendering":
  kind: Runtime
  text: >
    The browser builds and updates the page with JavaScript, rather than
    receiving a finished page from a server.
  ref: the-interface

"pure functions":
  kind: Runtime
  text: >
    The scoring engine's code style: same input always gives same
    output, no side effects.
  ref: the-engine

"state management / pub-sub":
  kind: Runtime
  text: >
    How the app tracks data and notifies its parts when new data
    arrives.
  ref: the-engine

"caching / ttl":
  kind: Runtime
  text: >
    Storing fetched data temporarily instead of re-fetching, with an
    expiry rule for staleness.
  ref: the-data

# -----------------------------------------------------------------------------
# Model vocabulary. Added when every section gained its own infobox: a section
# box names the terms that section is about, and these are the ones that recur
# across more than one of them. Each `ref` points at the section that actually
# explains the term, so a reader meeting it on Matchups can reach Calculations
# in one click.
# -----------------------------------------------------------------------------

"compositescore":
  kind: Model
  text: >
    The single number every fixture is reduced to. Five weighted
    sub-metrics are scored separately and combined into it, and it is
    what drives the colour band shown anywhere in the app.
  ref: calculations

"base difficulty":
  kind: Sub-metric
  text: >
    FPL's own 1–5 rating, rescaled to 10/30/50/70/90 and used only as a
    starting point. It is preseason-seeded, which is why team form
    exists to correct it in-season.
  ref: calculations

"counter-matchup":
  kind: Sub-metric
  text: >
    The heaviest calculation. Rather than asking how strong a team is,
    it asks where each side is strongest and weakest, and whether those
    shapes counter each other. Matures over 10 fixtures to a maximum
    0.25 weight.
  ref: calculations

"team form":
  kind: Sub-metric
  text: >
    Recent trajectory, adjusted for the strength of the opponents it was
    earned against. Matures over 5 fixtures to a maximum 0.2 weight, so
    two good games in August cannot read as perfect form.
  ref: calculations

"head-to-head":
  kind: Sub-metric
  text: >
    The real cross-season record between two clubs. Deliberately capped
    at a 0.1 weight — testing showed anything larger made predictions
    worse, because a rivalry from three managers ago is weak evidence.
  ref: fixtures-head-to-head

"home and away":
  kind: Sub-metric
  text: >
    How much venue matters to each side, measured as their home-versus-away
    points gap relative to the rest of the league, then applied as a boost
    to the home team and an equal penalty to the away team.
  ref: calculations

"maturity curve":
  kind: Control
  text: >
    A per-sub-metric ramp that holds a signal's weight down until enough
    fixtures have been played to trust it, rising linearly to its cap.
    It is what stops wild early-season data driving the score.
  ref: calculations

"stacking penalty":
  kind: Control
  text: >
    Applied across the sub-metrics so several weak secondary signals can
    tip a fixture without any single one doing it alone. It and the
    base-difficulty weight are a matched pair; neither is tuned alone.
  ref: calculations

"matchup breakdown":
  kind: Region
  text: >
    The central element of the Matchups page — the deep dive on one
    fixture, showing decision weight, confidence, playstyle counters and
    the overall prediction score.
  ref: matchup-the-tools

"full season strip":
  kind: Region
  text: >
    The bottom strip of the Matchups page, and the view with the longest
    horizon. It marks the gameweeks worth planning around rather than
    every fixture equally.
  ref: matchup-the-tools

"double gameweeks":
  kind: FPL term
  text: >
    A gameweek in which a club plays twice, usually because an earlier
    fixture was postponed and rescheduled into it. Highlighted on the
    season strip because it changes captaincy and chip decisions.
  ref: matchup-the-tools

"subtabs":
  kind: Pattern
  text: >
    The Fixtures page is split into four sub-views rather than one long
    scroll, chosen because the volume of historical statistics would
    otherwise bury whatever the reader came looking for.
  ref: fixtures-design

"starting xi":
  kind: Data
  text: >
    A real teamsheet with formation, derived from Understat's rosters via
    their position codes and substitution linkage. The FPL API exposes no
    teamsheet of any kind.
  ref: fixtures-gameweek

"data density":
  kind: Design problem
  text: >
    There is more data here than a page can show at once. The interface
    answers it with clear containers, colour, spacing and separated
    views rather than by showing less.
  ref: the-interface

"modular":
  kind: Architecture
  text: >
    Data is parsed once and made available globally across the site
    rather than re-fetched per view, which is what allows a new view to
    be added without a new data path.
  ref: approach
