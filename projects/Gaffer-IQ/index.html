<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaffer IQ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <noscript>Gaffer IQ requires JavaScript.</noscript>

  <div class="app-shell">

    <header class="app-nav">
      <div class="app-nav__brand">
        <span class="app-nav__logo">⚡</span>
        <span class="app-nav__title">Gaffer IQ</span>
      </div>

      <nav class="module-nav" aria-label="Module navigation">
        <a class="module-nav__item is-active" href="#matchup">Matchup</a>
        <a class="module-nav__item" href="#ranker">Ranker</a>
        <a class="module-nav__item module-nav__item--inactive" href="#dashboard" aria-disabled="true" tabindex="-1">Dashboard</a>
        <a class="module-nav__item module-nav__item--inactive" href="#planner" aria-disabled="true" tabindex="-1">Planner</a>
      </nav>

      <div class="horizon-switcher" role="group" aria-label="Planning horizon">
        <button class="horizon-switcher__btn is-active" data-horizon="GW1" type="button">This GW</button>
        <button class="horizon-switcher__btn" data-horizon="GW3" type="button">Next 3 GWs</button>
        <button class="horizon-switcher__btn" data-horizon="GW6" type="button">Next 6 GWs</button>
      </div>
    </header>

    <main class="app-main">

      <div id="app-error-banner" class="app-error-banner" hidden>
        <span id="app-error-text"></span>
        <button class="app-error-banner__retry" id="app-error-retry" type="button">Retry</button>
      </div>

      <section class="module-view is-active" data-module="matchup" aria-label="Matchup Analyser">
        <div class="matchup-controls"></div>
        <div class="matchup-grid">
          <div class="app-status">Loading FPL data…</div>
        </div>
      </section>

      <section class="module-view" data-module="ranker" aria-label="Player Ranker">

        <div class="ranker-controls">
          <div class="ranker-controls__pos-group" role="group" aria-label="Filter by position">
            <button class="ranker-pos-btn is-active" data-pos="GKP" type="button">GKP</button>
            <button class="ranker-pos-btn is-active" data-pos="DEF" type="button">DEF</button>
            <button class="ranker-pos-btn is-active" data-pos="MID" type="button">MID</button>
            <button class="ranker-pos-btn is-active" data-pos="FWD" type="button">FWD</button>
          </div>

          <div class="ranker-controls__select-wrap">
            <label class="ranker-controls__label" for="ranker-price">Price</label>
            <select class="ranker-select" id="ranker-price">
              <option value="all">All prices</option>
              <option value="budget">≤ £5.0m</option>
              <option value="mid">£5.1m – £8.0m</option>
              <option value="premium">£8.1m – £10.0m</option>
              <option value="elite">≥ £10.1m</option>
            </select>
          </div>

          <div class="ranker-controls__select-wrap">
            <label class="ranker-controls__label" for="ranker-team">Team</label>
            <select class="ranker-select" id="ranker-team">
              <option value="all">All teams</option>
            </select>
          </div>

          <button class="ranker-toggle-btn" id="ranker-vs-toggle"
                  type="button" aria-pressed="false">Show £/pt</button>
        </div>

        <div class="ranker-loading" id="ranker-loading">
          <span class="ranker-loading__text">Computing rankings…</span>
        </div>

        <div class="ranker-table-wrap">
          <table class="ranker-table">
            <thead id="ranker-thead"></thead>
            <tbody id="ranker-tbody">
              <tr><td class="ranker-table__empty" colspan="7">Loading FPL data…</td></tr>
            </tbody>
          </table>
        </div>

      </section>

      <section class="module-view" data-module="dashboard" aria-label="GW Dashboard">
        <p class="coming-soon">GW Decision Dashboard — coming in Phase 2.</p>
      </section>

      <section class="module-view" data-module="planner" aria-label="Transfer Planner">
        <p class="coming-soon">Transfer Planner — coming in Phase 2.</p>
      </section>

    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
