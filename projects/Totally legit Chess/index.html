<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <div class="game-area">

      <div class="board-wrapper">

        <div class="player-strip" id="opponent-strip">
          <div>
            <div class="player-name" id="opponent-name">Engine</div>
            <div class="captured-pieces" id="opponent-captured"></div>
          </div>
          <div class="player-clock" id="opponent-clock">0:00</div>
        </div>

        <div class="board-and-ranks">
          <div class="rank-labels" aria-hidden="true">
            <span class="coord-rank">8</span>
            <span class="coord-rank">7</span>
            <span class="coord-rank">6</span>
            <span class="coord-rank">5</span>
            <span class="coord-rank">4</span>
            <span class="coord-rank">3</span>
            <span class="coord-rank">2</span>
            <span class="coord-rank">1</span>
          </div>
          <div id="board" role="grid" aria-label="Chess board"></div>
        </div>

        <div class="coord-files" aria-hidden="true">
          <span class="coord-file">a</span>
          <span class="coord-file">b</span>
          <span class="coord-file">c</span>
          <span class="coord-file">d</span>
          <span class="coord-file">e</span>
          <span class="coord-file">f</span>
          <span class="coord-file">g</span>
          <span class="coord-file">h</span>
        </div>

        <div class="player-strip" id="player-strip">
          <div>
            <div class="player-name" id="player-name">You</div>
            <div class="captured-pieces" id="player-captured"></div>
          </div>
          <div class="player-clock active" id="player-clock">0:00</div>
        </div>

        <!-- Result overlay — fixed, covers viewport -->
        <div id="result-overlay" class="result-overlay">
          <div class="result-box">
            <div class="result-title" id="result-title"></div>
            <div class="result-sub"   id="result-sub"></div>
            <button class="btn primary" id="btn-play-again">Play Again</button>
          </div>
        </div>

        <!-- Promotion picker — fixed, centred -->
        <div id="promo-picker" class="promo-picker"></div>

      </div>

      <div class="side-panel">

        <div class="panel-section">
          <h3>Difficulty</h3>
          <div class="difficulty-row">
            <button class="diff-btn" data-diff="easy">Easy</button>
            <button class="diff-btn active" data-diff="medium">Medium</button>
            <button class="diff-btn" data-diff="hard">Hard</button>
          </div>
        </div>

        <div class="panel-section">
          <h3>Moves</h3>
          <div id="move-list"></div>
        </div>

        <div class="panel-section">
          <div id="status">White to move</div>
        </div>

        <div class="controls">
          <button class="btn primary" id="btn-new-game">New Game</button>
          <button class="btn" id="btn-resign">Resign</button>
        </div>

      </div>

    </div>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
