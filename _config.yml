# =============================================================================
# jayjaybee.com — Jekyll config
# GitHub Pages reads this file on every push and rebuilds the site. Edit
# site-wide defaults here; per-page details live in each page's front matter.
# =============================================================================

# Site-level fallbacks. Used by _layouts/default.html when a page omits its
# own title or description in front matter.
title: Josh Bailey
description: IT Desktop Analyst at Aston Martin F1. Endpoint work, PowerShell tooling, and the small, sharp tools that should already exist.
url: https://jayjaybee.com

# -----------------------------------------------------------------------------
# Layout defaults. Jekyll applies these in order, with later + more specific
# scopes overriding earlier ones.
#
#   projects/       the projects wiki. Any page dropped in here inherits the
#                   site chrome (header, nav, footer, global.css) without
#                   needing `layout: default` in its own front matter, so new
#                   write-ups pick up the jayjaybee.com look for free.
#
#   projects/apps/  self-contained sub-projects — FC26 calculator, Gaffer IQ.
#                   Each owns its entire document: own <head>, fonts, tokens,
#                   and stylesheets. They must NOT inherit anything from the
#                   site layout. This is belt-and-braces: none of them have
#                   front matter, so Jekyll already treats them as static
#                   assets and copies them verbatim — a layout default cannot
#                   reach a file Jekyll never renders. The override is here so
#                   the rule survives someone later adding front matter.
# -----------------------------------------------------------------------------
defaults:
  - scope:
      path: "projects"
    values:
      layout: default

  - scope:
      path: "projects/apps"
    values:
      layout: null

# -----------------------------------------------------------------------------
# Files Jekyll should ignore entirely (not copied to the live site).
# README.md and SKILL.md are repo meta. templates/ is a developer reference,
# not site content. node_modules/ etc. are defensive — none currently exist.
# -----------------------------------------------------------------------------
exclude:
  - README.md
  - SKILL.md
  - templates
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

  # -----------------------------------------------------------------------
  # Sub-project internals. GitHub Pages ships jekyll-optional-front-matter,
  # which promotes EVERY .md file to a rendered page whether or not it has
  # front matter — so project docs were both being published at
  # jayjaybee.com and run through Liquid. A JSDoc `@returns {{a: number}}`
  # in a plan doc reads as an unterminated Liquid variable and fails the
  # build for the whole site. These are engineering notes, not site
  # content; keep them out of the build entirely.
  #
  # Scoped to apps/ specifically, NOT all of projects/: the wiki pages in
  # projects/ are meant to be publishable, and many will be written in
  # Markdown. A blanket `projects/**/*.md` would silently swallow them.
  # -----------------------------------------------------------------------
  - "projects/apps/**/*.md"
  - projects/apps/gaffer-iq/docs
  - projects/apps/gaffer-iq/tests

  # -----------------------------------------------------------------------
  # Same trap as projects/apps/ above: docs/superpowers/ holds the plan and
  # spec documents for this work, and they contain literal Liquid examples
  # (e.g. `{% include ... %}` snippets shown as text). jekyll-optional-
  # front-matter promotes every .md file to a rendered page and runs it
  # through Liquid regardless of front matter, so those examples parse as
  # real tags and fail the build for the whole site. These are internal
  # engineering notes, not site content — leaving them unexcluded would
  # also publish them at jayjaybee.com/docs/superpowers/.
  # -----------------------------------------------------------------------
  - docs
