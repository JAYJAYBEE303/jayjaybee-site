<!-- =============================================================
     Blank page starter.

     Everything you can see before typing a single word — the paper
     background and grain, the header, wordmark, nav, search, theme
     toggle, the footer, the type scale, the reveal animations —
     comes from two shared files:

       _layouts/default.html   the chrome: <head>, header, footer,
                               the pre-paint theme/scroll-gate
                               script, animations.js and search.js.
       assets/css/global.css   the one stylesheet every page links.
                               It imports, in cascade order:
                                 variables.css  design tokens
                                 layout.css     page shell + rhythm
                                 components.css reusable UI pieces

     So this file carries page BODY ONLY. Whatever sits between the
     markers below is dropped into <main id="main" class="page"> by
     the layout at build time.

     -------------------------------------------------------------
     How to use
       1. Copy this file to the repo root or a sub-folder and
          rename it — e.g. projects/index.html, notes.html.
       2. Edit the front matter above. `layout: default` is the line
          that inherits all of the above; don't remove it. title
          fills the browser tab, description the meta tag.
       3. Write the page between the markers.

     What NOT to add
       * <!doctype>, <html>, <head>, <body>, <header>, <footer>
       * a stylesheet <link>, or script tags for animations/search
       * the skip link, the theme toggle, the pre-paint script
       All inherited. Duplicating any of them will fight the layout.

     -------------------------------------------------------------
     Section shapes already in the design system. Each major block
     is a top-level <section>; vertical spacing between them is
     handled by `.page > section + section` in layout.css, so don't
     add margins by hand.

       .lede-block                 page-opening headline
         .mono-label.lede-meta       small mono eyebrow
         h1.lede-line                serif headline
           .lede-line__row           one line of it

       .narrative > .prose         single body paragraph

       .roles > ol.role-list       reverse-chronological rows
         li.role-item                .role-when / .role-body

       .work > .work-list          project cards
         .work-item

       .about > .about__sub        numbered long-form subsections

     Every section except the lede opens with a .section-head:

       <header class="section-head">
         <span class="mono-label">Eyebrow</span>
         <h2 id="…-heading" class="section-title">Title.</h2>
       </header>

     and the <section> points at it with aria-labelledby.

     -------------------------------------------------------------
     NOTE: templates/ is listed under `exclude` in _config.yml, so
     this file is never published. It lives here as reference only.
     ============================================================= -->
